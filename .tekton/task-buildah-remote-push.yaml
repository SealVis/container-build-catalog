apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/SealVis/container-build-catalog?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "incoming" && target_branch
      == "rebuild" && ( "task/buildah-remote/***".pathChanged() || ".tekton/task-buildah-remote-push.yaml".pathChanged()
      || ".tekton/pipelines/build-tekton-bundle.yaml".pathChanged() )
  labels:
    appstudio.openshift.io/application: container-build-catalog
    appstudio.openshift.io/component: task-buildah-remote
    pipelines.appstudio.openshift.io/type: build
  name: task-buildah-remote-on-push
  namespace: default-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/sealvis-workloads/default-tenant/container-build-catalog/buildah-remote:{{revision}}
  - name: dockerfile
    value: Containerfile
  - name: path-context
    value: task/buildah-remote
  pipelineRef:
    name: build-tekton-bundle
  taskRunTemplate:
    serviceAccountName: build-pipeline-task-buildah-remote
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
